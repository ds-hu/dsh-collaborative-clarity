<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant B — the unsent comment stops the decision</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #5f6b7a;
    --line: rgba(0, 0, 0, 0.13);
    --layer1: #fafbfc;
    --layer2: #f2f4f6;
    --brand: #2f6fdb;
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #eef0f2;
    color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .hint {
    max-width: 560px;
    margin: 0 auto 12px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .hint b { color: var(--ink); }
  .panel {
    max-width: 560px;
    margin: 0 auto;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .title { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
  .comment {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--layer1);
    font-size: 12px;
  }
  .mark { flex: none; color: var(--brand); font-weight: 600; font-size: 10px; line-height: 16px; }
  .kill {
    flex: none;
    width: 16px; height: 16px;
    margin-left: auto;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    line-height: 16px;
    padding: 0;
  }
  .kill:hover { background: var(--layer2); color: var(--ink); }
  .row { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
  select, textarea {
    font: inherit;
    font-size: 12px;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  select { flex: none; }
  textarea { width: 100%; min-height: 44px; resize: vertical; line-height: 18px; }
  .row textarea { flex: 1 1 160px; width: auto; }
  textarea:focus, select:focus { border-color: var(--brand); }
  button.act {
    font: inherit;
    font-size: 12px;
    line-height: 18px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--layer2);
    color: var(--ink);
    cursor: pointer;
  }
  button.act:hover { background: #e9ecef; }
  button.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  button.primary:hover { background: #000; }
  .error { color: var(--error); font-size: 12px; }
  .result {
    max-width: 560px;
    margin: 12px auto 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 12px;
  }
  .result h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .result pre {
    margin: 0;
    font: 11.5px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre-wrap;
    color: var(--ink);
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="hint">
  <b>Try it.</b> Type a sentence in the box, then press <b>Accept B</b> — don't press Add.
  Variant B refuses, tells you to add it, and the Add button lights up while there is text waiting.
  (This is a mock of the panel bottom, not the panel.)
</div>

<div class="panel">
  <div class="title" id="count">Annotations 1</div>
  <div id="comments"></div>

  <div class="row">
    <select id="pick" aria-label="Comment on variant">
      <option>A</option>
      <option selected>B</option>
    </select>
    <textarea id="box" rows="2" placeholder="What should change? (Ctrl+Enter adds)"></textarea>
    <button class="act" id="add">Add</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div class="title">Note to the agent (optional)</div>
    <textarea rows="2" placeholder="One sentence the agent should carry into the implementation."></textarea>
  </div>

  <div class="error hidden" id="err" role="alert"></div>

  <div class="row">
    <button class="act primary" data-verdict="accept">Accept B</button>
    <button class="act" data-verdict="revise">Revise</button>
    <button class="act" data-verdict="reject">Reject</button>
    <button class="act" data-verdict="cancel">Decide later</button>
  </div>
</div>

<div class="result hidden" id="out">
  <h3>What the agent receives</h3>
  <pre id="outBody"></pre>
</div>

<script>
  const box = document.getElementById('box')
  const pick = document.getElementById('pick')
  const err = document.getElementById('err')
  const out = document.getElementById('out')
  const outBody = document.getElementById('outBody')
  const commentsEl = document.getElementById('comments')
  const countEl = document.getElementById('count')

  const comments = [
    { variant: 'B', text: '“30 days” is a policy, not copy. Make it “until you empty the trash”.' },
  ]

  function render() {
    commentsEl.innerHTML = ''
    comments.forEach((comment, index) => {
      const row = document.createElement('div')
      row.className = 'comment'
      row.style.marginBottom = '4px'
      const mark = document.createElement('span')
      mark.className = 'mark'
      mark.textContent = comment.variant
      const text = document.createElement('span')
      text.textContent = comment.text
      const kill = document.createElement('button')
      kill.className = 'kill'
      kill.textContent = '×'
      kill.title = 'Remove'
      kill.addEventListener('click', () => {
        comments.splice(index, 1)
        render()
      })
      row.append(mark, text, kill)
      commentsEl.append(row)
    })
    countEl.textContent = 'Annotations ' + comments.length
  }

  function showError(message) {
    err.textContent = message || ''
    err.classList.toggle('hidden', !message)
  }

  function add() {
    const text = box.value.trim()
    if (text === '') {
      showError('Write a comment first.')
      return
    }
    comments.push({ variant: pick.value, text })
    box.value = ''
    showError('')
    render()
  }

  function send(verdict) {
    // Variant B: the decision stops while the box still holds something.
    if (verdict !== 'cancel' && box.value.trim() !== '') {
      showError('One comment is unsent — press Add first.')
      return
    }
    if (verdict === 'cancel') {
      outBody.textContent = 'status: cancelled\nnothing is sent'
    } else {
      const lines = comments.map((c, i) => `${i + 1}. [${c.variant}] ${c.text}`).join('\n')
      outBody.textContent = `verdict: ${verdict}\ncomments: ${comments.length}\n${lines || '(none)'}`
    }
    out.classList.remove('hidden')
    showError('')
  }

  box.addEventListener('input', () => {
    document.getElementById('add').classList.toggle('primary', box.value.trim() !== '')
  })
  document.getElementById('add').addEventListener('click', add)
  box.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault()
      add()
    }
  })
  document.querySelectorAll('[data-verdict]').forEach((button) =>
    button.addEventListener('click', () => send(button.dataset.verdict)),
  )

  render()
</script>
</body>
</html>
