<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant B — 插件自带开关</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #5f6b7a;
    --line: rgba(0, 0, 0, 0.13);
    --layer1: #fafbfc;
    --layer2: #f2f4f6;
    --brand: #2f6fdb;
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px;
    background: #eef0f2;
    color: var(--ink);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .note {
    max-width: 560px;
    margin: 0 auto 10px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--muted);
    font-size: 12px;
  }
  .note b { color: var(--ink); }
  .panel {
    max-width: 560px;
    margin: 0 auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--layer1);
  }
  .tabname { font-weight: 600; font-size: 12px; letter-spacing: .01em; }
  .lang {
    margin-left: auto;
    font: inherit;
    font-size: 11px;
    line-height: 16px;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    cursor: pointer;
  }
  .lang:hover { color: var(--ink); border-color: var(--muted); }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 11px; }
  .head { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .decision { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .context { font-size: 12px; color: var(--muted); }
  .calls { font-size: 11.5px; color: var(--muted); }
  .calls b { color: var(--ink); font-weight: 600; }
  .cards { display: flex; gap: 8px; }
  .card {
    flex: 1 1 0;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--layer1);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card.pick { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .tag {
    align-self: flex-start;
    width: 16px; height: 16px;
    border-radius: 3px;
    background: var(--ink);
    color: #fff;
    font: 700 9px/16px -apple-system, sans-serif;
    text-align: center;
  }
  .card.pick .tag { background: var(--brand); }
  .fake { height: 6px; border-radius: 3px; background: #dbe0e5; }
  .fake.w70 { width: 70%; }
  .fake.w45 { width: 45%; }
  .fake.w85 { width: 85%; }
  .section { display: flex; flex-direction: column; gap: 5px; }
  .title { font-size: 11px; font-weight: 600; color: var(--muted); }
  .comment {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--layer1);
    font-size: 12px;
  }
  .mark { flex: none; color: var(--brand); font-weight: 600; font-size: 10px; line-height: 17px; }
  .who { flex: none; color: var(--muted); font-size: 10px; line-height: 17px; }
  .row { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
  select, textarea {
    font: inherit;
    font-size: 12px;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  select { flex: none; }
  textarea { width: 100%; min-height: 40px; resize: vertical; line-height: 18px; }
  .row textarea { flex: 1 1 150px; width: auto; }
  select:focus, textarea:focus { border-color: var(--brand); }
  button.act {
    font: inherit;
    font-size: 12px;
    line-height: 18px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--layer2);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  button.danger { color: var(--error); }
</style>
</head>
<body>

<div class="note">
  <b>B — 插件自带开关。</b>右上角一个 <b>中 / EN</b>，只影响这个标签页，不看
  Settings 里选了什么。点一下试试，它真的会切。这个 mock 只画面板，其他按钮不是真在跑。
</div>

<div class="panel">
  <div class="bar">
    <span class="tabname">Clarity</span>
    <button class="lang" id="lang">EN</button>
  </div>

  <div class="body">
    <div class="head">
      <div class="eyebrow" data-zh="第 7 轮 · 决定" data-en="ROUND 7 · DECISION">第 7 轮 · 决定</div>
      <div class="decision" data-zh="删除要永久，还是先进回收站 30 天？"
           data-en="Permanent delete, or 30 days in the trash?">删除要永久，还是先进回收站 30 天？</div>
      <div class="context" data-zh="Atlas 是个真实项目，现在的菜单写的是「删除」。这一步决定下次误操作能不能救回来。"
           data-en="Atlas is a live project and the menu says Delete. This decides whether the next mistake is recoverable.">Atlas
        是个真实项目，现在的菜单写的是「删除」。这一步决定下次误操作能不能救回来。</div>
      <div class="calls" data-zh="推荐：B　放弃：立刻回收空间、一个简单的 DELETE 接口"
           data-en="Recommended: B  Forecloses: immediate reclamation; a simple DELETE endpoint">推荐：B　放弃：立刻
        回收空间、一个简单的 DELETE 接口</div>
    </div>

    <div class="cards">
      <div class="card">
        <span class="tag">A</span>
        <div class="fake w85"></div>
        <div class="fake w70"></div>
        <div class="fake w45"></div>
      </div>
      <div class="card pick">
        <span class="tag">B</span>
        <div class="fake w85"></div>
        <div class="fake w70"></div>
        <div class="fake w45"></div>
      </div>
    </div>

    <div class="section">
      <div class="title" data-zh="批注 2" data-en="Annotations 2">批注 2</div>
      <div class="comment">
        <span class="mark">B</span>
        <span data-zh="「30 天」是策略，不是文案。改成「直到你清空回收站」，并告诉我回收站在哪。"
              data-en="“30 days” is a policy, not copy. Make it “until you empty the trash”, and show me where the trash lives.">「30
          天」是策略，不是文案。改成「直到你清空回收站」，并告诉我回收站在哪。</span>
      </div>
      <div class="comment">
        <span class="mark">A</span>
        <span class="who" data-zh="文字：" data-en="TEXT:">文字：</span>
        <span data-zh="「永久删除」太轻描淡写了，写成「不可恢复」。"
              data-en="“Permanently deletes” is too soft. Say “cannot be undone”.">「永久删除」太轻描淡写了，写成「不可恢复」。</span>
      </div>
    </div>

    <div class="row">
      <select aria-label="批注对象">
        <option>A</option>
        <option selected>B</option>
      </select>
      <textarea id="box" rows="2" data-ph-zh="哪里要改？（Ctrl+Enter 添加）"
                data-ph-en="What should change? (Ctrl+Enter adds)"
                placeholder="哪里要改？（Ctrl+Enter 添加）"></textarea>
      <button class="act" data-zh="添加" data-en="Add">添加</button>
    </div>

    <div class="section">
      <div class="title" data-zh="给 agent 的说明（可选）" data-en="Note to the agent (optional)">给 agent 的说明（可选）</div>
      <textarea data-ph-zh="一句话，让 agent 带进实现里。" data-ph-en="One sentence the agent should carry into the implementation."
                placeholder="一句话，让 agent 带进实现里。"></textarea>
    </div>

    <div class="row">
      <button class="act primary" data-zh="接受 B" data-en="Accept B">接受 B</button>
      <button class="act" data-zh="改 B" data-en="Revise B">改 B</button>
      <button class="act danger" data-zh="两个都不要" data-en="Reject A&B">两个都不要</button>
      <button class="act" data-zh="待会儿再说" data-en="Decide later">待会儿再说</button>
    </div>
  </div>
</div>

<script>
  const toggle = document.getElementById('lang')
  let lang = 'zh'

  function apply() {
    for (const el of document.querySelectorAll('[data-zh]')) {
      el.textContent = el.dataset[lang === 'zh' ? 'zh' : 'en']
    }
    for (const el of document.querySelectorAll('[data-ph-zh]')) {
      el.placeholder = el.dataset[lang === 'zh' ? 'phZh' : 'phEn']
    }
    toggle.textContent = lang === 'zh' ? 'EN' : '中'
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
  }

  toggle.addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh'
    apply()
  })
  apply()
</script>
</body>
</html>
