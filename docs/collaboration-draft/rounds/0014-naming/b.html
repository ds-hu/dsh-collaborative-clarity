<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>变体 B — 评论</title>
<style>
  body {
    margin: 0; padding: 14px;
    background: #eef0f2; color: #1f2328;
    font: 13px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    max-width: 560px; margin: 0 auto; padding: 12px;
    background: #fff; border: 1px solid rgba(0,0,0,.13); border-radius: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .title { font-size: 11px; font-weight: 600; color: #5f6b7a; }
  .item {
    display: flex; gap: 6px; align-items: baseline;
    padding: 6px 8px; border: 1px solid rgba(0,0,0,.13); border-radius: 6px;
    background: #fafbfc; font-size: 12px;
  }
  .mark { flex: none; color: #2f6fdb; font-weight: 600; font-size: 10px; }
  .where { flex: none; color: #5f6b7a; font-size: 10px; }
  .hint { color: #5f6b7a; font-size: 12px; }
  .why {
    max-width: 560px; margin: 12px auto 0; padding: 10px 12px;
    background: #fff; border: 1px solid rgba(0,0,0,.13); border-radius: 8px;
    font-size: 12px; color: #1f2328;
  }
  .why b { color: #5f6b7a; font-weight: 600; }
</style>
</head>
<body>

<div class="panel">
  <div class="title">评论 3</div>

  <div class="item">
    <span class="mark">B</span>
    <span>「30 天」是策略，不是文案。改成「直到你清空回收站」。</span>
  </div>

  <div class="item">
    <span class="mark">A</span>
    <span class="where">元素 · 删除项目</span>
    <span>这个按钮太红了，像危险操作。</span>
  </div>

  <div class="item">
    <span class="mark">B</span>
    <span class="where">第 12–14 行</span>
    <span>这三行可以并成一行。</span>
  </div>

  <div class="hint">点「标注」可以再指一处。</div>
</div>

<div class="why">
  <b>为什么叫评论：</b>代码评审、issue、博客，用的都是这个词；它不要求读者先理解
  「标注」和「批注」的关系。代价是：和「标注」按钮不再是同一个词根。
</div>

</body>
</html>
